name: Renovate config validator

# Reusable workflow: validates the Renovate config in the calling repository.
# Usage from a repository:
#
#   jobs:
#     validate:
#       uses: setchy/renovate-config/.github/workflows/validate-repo-config.yml@main
#       permissions:
#         contents: read
on:
  workflow_call:

permissions: {}

jobs:
  validate:
    name: Config validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install Renovate
        run: npm install --global renovate

      - name: Validate Renovate config
        run: renovate-config-validator --strict
